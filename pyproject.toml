[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equitybt"
version = "0.1.0"
description = "Equity alpha research and backtesting on daily data"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "pandas>=3.0",
    "pyarrow>=15",
    "plotly>=5.20",
    "yfinance>=0.2.40",
    "psutil>=5.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
dashboard = [
    "streamlit>=1.40",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/equitybt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
no-sections = true
